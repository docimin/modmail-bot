name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run typecheck

      - run: bun run test

      - run: bun run build
        env:
          DATABASE_URL: postgres://modmail:modmail@localhost:5432/modmail
          DISCORD_CLIENT_ID: "000000000000000000"
          DISCORD_CLIENT_SECRET: ci-placeholder
          BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-chars
          INTERNAL_API_SECRET: ci-placeholder-secret-at-least-32-chars
